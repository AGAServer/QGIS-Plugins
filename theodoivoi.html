<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Trạm Voi">
    <meta name="theme-color" content="#27AE60">
    <title>Trạm Phát Tín Hiệu & Dò Tìm Voi</title>
    
    <!-- Link Manifest Ảo tạo PWA -->
    <link rel="manifest" id="manifest-link">
    <link rel="icon" sizes="192x192" href="https://cdn-icons-png.flaticon.com/512/3075/3075908.png">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3075/3075908.png">

    <!-- Thư viện Bản đồ -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #EAF3EC; margin: 0; padding: 0; color: #1B4D3E; display: flex; flex-direction: column; height: 100vh;}
        
        /* 1. KHU VỰC CHỨA ẢNH NỀN TOÀN MÀN HÌNH */
        #roleSelection { 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; 
            background: url('voilak.png') center center / cover no-repeat;
            z-index: 9999; padding: 20px;
        }
        
        /* 2. CÁI HỘP TRẮNG (CARD) CHỨA CÁC NÚT BẤM */
        .login-card {
            background-color: rgba(255, 255, 255, 0.95); /* Nền trắng hơi trong suốt một chút cho sang trọng */
            padding: 35px 25px;
            border-radius: 15px; /* Bo góc tròn */
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); /* Bóng đổ 3D nổi bật */
            width: 100%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .login-card h2 { color: #27AE60; font-size: 26px; margin: 0 0 10px 0; text-align: center; }
        .login-card p { color: #7F8C8D; text-align: center; margin-bottom: 25px; font-size: 14px; }
        
        .role-btn { width: 100%; padding: 16px; font-size: 15px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.15); transition: transform 0.1s;}
        .role-btn:active { transform: scale(0.98); }
        .btn-nai { background-color: #27AE60; }
        .btn-guide { background-color: #2980B9; }
        .btn-install { background-color: #F39C12; margin-top: 10px; border: 2px dashed #E67E22; color: #fff;}

        /* BẢNG ĐIỀU KHIỂN CHUNG BÊN TRONG */
        .controls { background: white; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); z-index: 1000;}
        input { width: 90%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; font-weight: bold; text-align: center; font-size: 16px;}
        button.action-btn { width: 100%; padding: 12px; font-size: 15px; font-weight: bold; color: white; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 5px; }
        .btn-back { background-color: #BDC3C7; color: #2C3E50; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: bold; margin-bottom: 10px; width: 100%; }
        
        #status { font-size: 13px; color: #7F8C8D; font-weight: bold; margin-top: 5px; text-align: center;}
        #map { flex-grow: 1; width: 100%; display: none; } 
        #cameraBox { width: 100%; height: 350px; display: none; border: none; }
        
        /* THÔNG TIN HƯỚNG DẪN VIÊN (LA BÀN) */
        #guideInfo { display: none; background: #34495E; color: white; padding: 10px; text-align: center; font-size: 14px; z-index: 1000; }
        #compassBox { display: flex; justify-content: center; align-items: center; margin-top: 5px; }
        .compass-circle { width: 60px; height: 60px; border: 3px solid #F1C40F; border-radius: 50%; display: flex; justify-content: center; align-items: center; position: relative; }
        .compass-arrow { width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-bottom: 30px solid #E74C3C; position: absolute; transform-origin: 50% 100%; bottom: 50%; transition: transform 0.2s ease-out; }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: CHỌN VAI TRÒ -->
    <div id="roleSelection">
        <!-- HỘP TRẮNG BO GÓC BÊN TRONG NỀN ẢNH -->
        <div class="login-card">
            <h2>🐘 HỆ THỐNG LẮK TOUR</h2>
            <p>Vui lòng chọn vai trò của bạn để bắt đầu.</p>
            
            <button class="role-btn btn-nai" onclick="selectRole('nai')">🐘 TÔI LÀ NÀI VOI</button>
            <button class="role-btn btn-guide" onclick="selectRole('guide')">🧭 TÔI LÀ HƯỚNG DẪN VIÊN</button>
            
            <button class="role-btn btn-install" id="btnInstall" onclick="installApp()">📱 CÀI ĐẶT RA MÀN HÌNH CHÍNH</button>
        </div>
    </div>

    <!-- MÀN HÌNH 2: BẢNG ĐIỀU KHIỂN -->
    <div class="controls" id="mainControls" style="display: none;">
        <!-- NÚT QUAY LẠI -->
        <button class="btn-back" onclick="goBack()">🔙 QUAY LẠI CHỌN VAI TRÒ</button>
        
        <h3 id="panelTitle" style="margin: 0 0 10px 0; text-align: center;">...</h3>
        <input type="text" id="deviceId" placeholder="Nhập ID...">
        
        <!-- Các nút cho Nài Voi -->
        <div id="naiButtons" style="display: none;">
            <button class="action-btn" style="background-color: #27AE60;" id="btnStartNai" onclick="startTrackingNai()">▶ BẬT ĐỊNH VỊ GPS</button>
            <button class="action-btn" style="background-color: #8E44AD;" id="btnCamera" onclick="startCamera()" style="display:none;">🎥 PHÁT CAMERA TRỰC TIẾP</button>
            <button class="action-btn" style="background-color: #E74C3C; display:none;" id="btnStopNai" onclick="stopTracking()">⏹ DỪNG CHIA SẺ</button>
        </div>

        <!-- Các nút cho Hướng Dẫn Viên -->
        <div id="guideButtons" style="display: none;">
            <button class="action-btn" style="background-color: #2980B9;" id="btnStartGuide" onclick="startTrackingGuide()">🧭 TÌM KIẾM NÀI VOI NÀY</button>
            <button class="action-btn" style="background-color: #E74C3C; display:none;" id="btnStopGuide" onclick="stopTracking()">⏹ HỦY TÌM KIẾM</button>
        </div>
        <div id="status">Trạng thái: Đang chờ...</div>
    </div>
    
    <!-- KHUNG HIỂN THỊ LA BÀN & KHOẢNG CÁCH CHO HDV -->
    <div id="guideInfo">
        <div>Khoảng cách đến Voi: <b id="distanceText" style="color: #F1C40F;">Đang tính...</b></div>
        <div id="compassBox">
            <div class="compass-circle">
                <div class="compass-arrow" id="compassArrow"></div>
            </div>
            <span style="margin-left: 15px; font-size: 12px; text-align: left;">
                Mũi tên đỏ chỉ hướng Nài Voi.<br><i>(Yêu cầu bật xoay tự động)</i>
            </span>
        </div>
    </div>

    <iframe id="cameraBox" allow="camera; microphone; fullscreen"></iframe>
    <div id="map"></div>

    <script>
        // ==========================================
        // CẤU HÌNH PWA CÀI ĐẶT APP 
        // ==========================================
        const manifest = {
            "name": "Trạm Voi Lắk",
            "short_name": "Trạm Voi",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#ffffff",
            "theme_color": "#27AE60",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/3075/3075908.png",
                "sizes": "512x512",
                "type": "image/png"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        document.getElementById('manifest-link').href = URL.createObjectURL(manifestBlob);

        if ('serviceWorker' in navigator) {
            const swCode = `self.addEventListener('fetch', function(e) {});`;
            const swBlob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => { deferredPrompt = null; });
            } else {
                const isIos = /iphone|ipad|ipod/.test(window.navigator.userAgent.toLowerCase());
                const isInStandaloneMode = ('standalone' in window.navigator) && (window.navigator.standalone);
                
                if (isInStandaloneMode) {
                    alert("Ứng dụng này đã được cài đặt trên máy của bạn rồi!");
                } else if (isIos) {
                    alert("🍏 ĐỂ CÀI ĐẶT TRÊN iPHONE:\n\n1. Nhìn xuống cạnh dưới cùng của màn hình Safari.\n2. Bấm vào biểu tượng 'Chia sẻ' (Hình ô vuông có mũi tên trỏ lên).\n3. Vuốt xuống và chọn 'Thêm vào MH chính' (Add to Home Screen).");
                } else {
                    alert("⚙️ TRÌNH DUYỆT KHÔNG HỖ TRỢ:\n\nVui lòng bấm vào Menu (3 dấu chấm góc phải trên cùng) -> Chọn 'Thêm vào Màn hình chính'.");
                }
            }
        }

        // ==========================================
        // CÁC CHỨC NĂNG CHÍNH CỦA BẢN ĐỒ
        // ==========================================
        const API_URL = "https://script.google.com/macros/s/AKfycbzgkTwcVP5rVifEz3SsmsGCvb2ttczeR3yh3LvTW_69VHOHfIMk-38mln3lWfGruELe/exec"; 
        
        let currentRole = "";
        let watchId = null;
        let map, myMarker;
        let targetMarkers = {}; 
        let routingLine = null;
        let fetchInterval = null;
        let myLat = null, myLon = null, targetLat = null, targetLon = null;
        
        // BIẾN QUẢN LÝ CHỐNG TẮT MÀN HÌNH
        let wakeLock = null;

        map = L.map('map').setView([12.345, 108.123], 13);
        L.tileLayer('http://mt0.google.com/vt/lyrs=s&hl=en&x={x}&y={y}&z={z}', {
            maxZoom: 20, attribution: '© Google Satellite'
        }).addTo(map);

        // HÀM YÊU CẦU GIỮ SÁNG MÀN HÌNH
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Lỗi Wake Lock: ${err.message}`);
            }
        }

        // TỰ ĐỘNG BẬT LẠI WAKE LOCK NẾU NGƯỜI DÙNG ẨN/MỞ LẠI APP
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        // HÀM CHỌN VAI TRÒ
        function selectRole(role) {
            currentRole = role;
            document.getElementById("roleSelection").style.display = "none";
            document.getElementById("mainControls").style.display = "block";
            document.getElementById("map").style.display = "block";
            map.invalidateSize(); 

            if (role === 'nai') {
                document.getElementById("panelTitle").innerHTML = "🐘 CHẾ ĐỘ NÀI VOI";
                document.getElementById("panelTitle").style.color = "#27AE60";
                document.getElementById("deviceId").placeholder = "Nhập Mã Của Bạn (VD: LAK_01)";
                document.getElementById("naiButtons").style.display = "block";
                document.getElementById("guideButtons").style.display = "none";
            } else {
                document.getElementById("panelTitle").innerHTML = "🧭 CHẾ ĐỘ HƯỚNG DẪN VIÊN";
                document.getElementById("panelTitle").style.color = "#2980B9";
                document.getElementById("deviceId").placeholder = "Nhập Mã Voi Cần Tìm (VD: LAK_01)";
                document.getElementById("guideButtons").style.display = "block";
                document.getElementById("naiButtons").style.display = "none";
            }
        }

        // HÀM QUAY LẠI MÀN HÌNH CHÍNH
        function goBack() {
            stopTracking();
            document.getElementById("mainControls").style.display = "none";
            document.getElementById("map").style.display = "none";
            document.getElementById("roleSelection").style.display = "flex";
            document.getElementById("naiButtons").style.display = "none";
            document.getElementById("guideButtons").style.display = "none";
            document.getElementById("deviceId").value = ""; 
            currentRole = "";
        }

        // ==========================================
        // CHỨC NĂNG CỦA NÀI VOI
        // ==========================================
        function startTrackingNai() {
            const deviceId = document.getElementById("deviceId").value.trim();
            if (!deviceId) { alert("Vui lòng nhập Mã!"); return; }
            if (!navigator.geolocation) { alert("Điện thoại không hỗ trợ GPS."); return; }

            // Bật chống tắt màn hình
            requestWakeLock();

            document.getElementById("btnStartNai").style.display = "none";
            document.getElementById("btnStopNai").style.display = "block";
            document.getElementById("btnCamera").style.display = "block";
            document.getElementById("deviceId").disabled = true;
            document.getElementById("status").innerHTML = "🟢 Đang phát tín hiệu (Đã bật chống ngủ)...";
            document.getElementById("status").style.color = "#27AE60";

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    if (!myMarker) {
                        myMarker = L.circleMarker([lat, lon], {color: '#27AE60', radius: 8, fillOpacity: 1}).addTo(map);
                        myMarker.bindPopup("<b>Bạn (Nài Voi)</b>");
                        map.setView([lat, lon], 16);
                    } else {
                        myMarker.setLatLng([lat, lon]);
                    }
                    fetch(`${API_URL}?action=update_location&device_id=${deviceId}&lat=${lat}&lon=${lon}`);
                },
                (error) => { document.getElementById("status").innerHTML = "❌ Lỗi GPS!"; },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }

        function startCamera() {
            const deviceId = document.getElementById("deviceId").value.trim();
            document.getElementById("map").style.display = "none";
            document.getElementById("cameraBox").style.display = "block";
            document.getElementById("cameraBox").src = `https://meet.jit.si/DoanNgocAn_TramVoi_${deviceId}#config.prejoinPageEnabled=false`;
            
            document.getElementById("btnCamera").innerHTML = "🔴 ĐANG PHÁT SÓNG TRỰC TIẾP";
            document.getElementById("btnCamera").style.backgroundColor = "#E74C3C";
        }

        // ==========================================
        // CHỨC NĂNG CỦA HƯỚNG DẪN VIÊN
        // ==========================================
        function startTrackingGuide() {
            const targetId = document.getElementById("deviceId").value.trim();
            if (!targetId) { alert("Vui lòng nhập Mã Nài Voi cần tìm!"); return; }
            if (!navigator.geolocation) { alert("Điện thoại không hỗ trợ GPS."); return; }

            requestWakeLock();

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    if (permissionState === 'granted') { window.addEventListener('deviceorientation', handleOrientation); }
                }).catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }

            document.getElementById("btnStartGuide").style.display = "none";
            document.getElementById("btnStopGuide").style.display = "block";
            document.getElementById("deviceId").disabled = true;
            document.getElementById("guideInfo").style.display = "block";
            document.getElementById("status").innerHTML = `🟢 Đang quét Radar tìm [${targetId}]...`;
            document.getElementById("status").style.color = "#2980B9";

            watchId = navigator.geolocation.watchPosition(
                (position) => {
                    myLat = position.coords.latitude;
                    myLon = position.coords.longitude;
                    
                    if (!myMarker) {
                        myMarker = L.circleMarker([myLat, myLon], {color: '#2980B9', radius: 8, fillOpacity: 1}).addTo(map);
                        myMarker.bindPopup("<b>Bạn (HDV)</b>");
                        map.setView([myLat, myLon], 16);
                    } else {
                        myMarker.setLatLng([myLat, myLon]);
                    }
                    updateRouting(); 
                },
                (error) => { document.getElementById("status").innerHTML = "❌ Lỗi GPS!"; },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );

            fetchInterval = setInterval(() => fetchTargetLocation(targetId), 5000);
            fetchTargetLocation(targetId);
        }

        function fetchTargetLocation(targetId) {
            fetch(`${API_URL}?action=get_all`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    let found = false;
                    data.data.forEach(voi => {
                        if (voi.id === targetId) { 
                            found = true;
                            targetLat = parseFloat(voi.lat);
                            targetLon = parseFloat(voi.lon);
                            
                            while(targetLat > 90 || targetLat < -90) targetLat /= 10.0;
                            while(targetLon > 180 || targetLon < -180) targetLon /= 10.0;
                            
                            if(targetMarkers[voi.id]) {
                                targetMarkers[voi.id].setLatLng([targetLat, targetLon]);
                            } else {
                                targetMarkers[voi.id] = L.marker([targetLat, targetLon]).addTo(map);
                                targetMarkers[voi.id].bindTooltip(voi.id, {permanent: true, direction: 'right'});
                            }
                            updateRouting();
                        }
                    });
                    if(!found) {
                        document.getElementById("distanceText").innerHTML = "Mất tín hiệu Voi!";
                        document.getElementById("distanceText").style.color = "#E74C3C";
                    }
                }
            });
        }

        function updateRouting() {
            if (myLat && myLon && targetLat && targetLon) {
                const myPos = L.latLng(myLat, myLon);
                const targetPos = L.latLng(targetLat, targetLon);
                
                const distance = Math.round(map.distance(myPos, targetPos));
                document.getElementById("distanceText").innerHTML = `${distance} mét`;
                document.getElementById("distanceText").style.color = "#F1C40F";

                if (routingLine) { map.removeLayer(routingLine); }
                routingLine = L.polyline([myPos, targetPos], {color: 'red', dashArray: '5, 5', weight: 3}).addTo(map);
                
                map.fitBounds(routingLine.getBounds(), {padding: [50, 50]});
            }
        }

        function handleOrientation(event) {
            if (!myLat || !targetLat) return; 
            let phoneHeading = event.webkitCompassHeading || Math.abs(event.alpha - 360); 
            
            const dLon = (targetLon - myLon) * Math.PI / 180;
            const lat1 = myLat * Math.PI / 180;
            const lat2 = targetLat * Math.PI / 180;
            const y = Math.sin(dLon) * Math.cos(lat2);
            const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
            let bearing = Math.atan2(y, x) * 180 / Math.PI;
            bearing = (bearing + 360) % 360;

            let arrowRotation = bearing - phoneHeading;
            document.getElementById("compassArrow").style.transform = `rotate(${arrowRotation}deg)`;
        }

        function stopTracking() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => { wakeLock = null; });
            }

            if (watchId !== null) navigator.geolocation.clearWatch(watchId);
            if (fetchInterval !== null) clearInterval(fetchInterval);
            window.removeEventListener('deviceorientation', handleOrientation);
            
            if (routingLine) { map.removeLayer(routingLine); routingLine = null; }

            document.getElementById("btnStartNai").style.display = "block";
            document.getElementById("btnStartGuide").style.display = "block";
            
            document.getElementById("btnStopNai").style.display = "none";
            document.getElementById("btnStopGuide").style.display = "none";
            
            document.getElementById("btnCamera").style.display = "none";
            document.getElementById("guideInfo").style.display = "none";
            
            document.getElementById("deviceId").disabled = false;
            
            document.getElementById("cameraBox").src = "";
            document.getElementById("cameraBox").style.display = "none";
            document.getElementById("map").style.display = "block";
            
            document.getElementById("status").innerHTML = "🔴 Đã dừng thiết bị.";
            document.getElementById("status").style.color = "#E74C3C";
            
            myLat = null; targetLat = null;
        }
    </script>
</body>
</html>
